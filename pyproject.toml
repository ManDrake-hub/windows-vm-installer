[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-vm-installer"
dynamic = ["version"]
description = "Install Windows onto a physical disk from Linux, through a hidden virtual machine"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Geraldino Mandragora" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/ManDrake-hub/windows-vm-installer"
Issues = "https://github.com/ManDrake-hub/windows-vm-installer/issues"

[project.scripts]
windows-vm-installer = "wvi.cli:main"

[project.gui-scripts]
windows-vm-installer-gui = "wvi.gui:run"

[project.optional-dependencies]
gui = ["PyGObject>=3.42"]

[tool.setuptools.dynamic]
version = { attr = "wvi.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
